    <!-- OGP / X(Twitter)カード: 共有した時にプレビュー(サムネイル)が表示されるようにするための設定。
         注意: 共有リンクの中身(曲データ)はURLの#以降(フラグメント)に埋め込まれており、これは
         ブラウザだけが読める部分でサーバーには送られない仕様のため、SNS側のクローラーは中身を
         見ることができない。そのため「共有した曲そのもの」のサムネイルは技術的に作れず、
         ここでは「うたコレ」というアプリ自体の共通の画像・説明文を表示する形にしている。
         曲ごとに違うサムネイルを出したい場合は、共有リンクごとにサーバー側でHTMLを動的生成する
         仕組み(簡単なサーバーレス関数など)が別途必要になる。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="うたコレ" />
    <meta property="og:title" content="うたコレ" />
    <meta property="og:description" content="自分が歌った・聴いた曲を記録し、プレイリストとして再生できるアプリ" />
    <meta property="og:url" content="https://utacolle.com/" />
